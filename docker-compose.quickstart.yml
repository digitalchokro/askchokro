services:
  askchokro:
    build:
      context: .
      dockerfile: packages/microservice/Dockerfile
    container_name: askchokro-quickstart
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=256
      - DATABASE_URL=sqlite:///data/quickstart.db
      - ASKCHOKRO_PROVIDER=${ASKCHOKRO_PROVIDER:-ollama}
      - ASKCHOKRO_MODEL=${ASKCHOKRO_MODEL:-qwen2.5:0.5b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ASKCHOKRO_ALLOW_UNAUTHENTICATED=true
    volumes:
      - quickstart_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "node quickstart/seed.cjs && node dist/index.js"]
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  quickstart_data:
