name: Security Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/security-audit.yml'
      - 'scripts/report-security-audit*.cjs'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notification-tests:
    name: Security audit notification tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/report-security-audit.test.cjs

  audit:
    name: npm Audit
    if: github.event_name != 'pull_request'
    needs: notification-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run security audit
        id: audit
        run: pnpm audit --audit-level=high --json > security-audit.json
      - name: Report confirmed vulnerabilities
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const report = JSON.parse(require('node:fs').readFileSync('security-audit.json', 'utf8'));
            await require('./scripts/report-security-audit.cjs')({ github, context, report });
      - name: Upload audit report
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: security-audit.json
          if-no-files-found: ignore
